[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-visual-assistant"
version = "0.2.0"
description = "Privacy-first screen capture tool that lets AI assistants (Grok, Claude, Cursor, etc.) see your desktop in near real-time via local PNG files only."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  {name = "gadalleore"}
]
keywords = ["screen-capture", "ai", "visual-assistant", "grok", "claude", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
fast = [
    "mss>=9.0.1",
]
dev = [
    "black",
    "ruff",
]

[project.scripts]
screen-watcher = "screen_watcher:main"

[tool.setuptools]
py-modules = ["screen_watcher"]

[tool.setuptools.package-data]
"*" = ["FOLLOW_MODE_INSTRUCTIONS.txt"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
